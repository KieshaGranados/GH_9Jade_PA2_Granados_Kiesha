<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Tables and Images with Bootstrap</title>
</head>
<body>
    <h2 class="text-center">Naruto Characters - Team 7</h2>
    <div class="row">
    <img class="rounded mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfn436uYudB2Nvu3pJbY753H7GU0fgAEW4Zz93akyeg4YUAk-L8oYzJlQ&s=10" alt="Uchiha Sasuke" height="300" width="450">
    <img class="rounded-circle mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbNCtX6W938PKbmGap8GEVqZAAKH7gyShQG5ngsdOXjh_spGLaTpArnSI&s=10" alt="Uchiha Sakura" height="300" width="450">
    <img class="img-thumbnail mx-auto d-block col-lg-4" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR06exO3lzpSy-XaZ_MgjE2mgcDx0S7aLY0FFoY_bWtm6mU0o1fSpiNr91w&s=10" alt="Uzumaki Naruto" height="300" width="450">
    </div>

    <h1 class="text-center">Bootstrap Table</h1>
    <img class="mx-auto d-block" src="https://i.pinimg.com/736x/8d/fd/2a/8dfd2a75c5dd2327a96307629e48c084.jpg" alt="Spiderman" height="350" width="250">

    <table class="table table-striped table-hover container">
        <tr>
            <th class="bg-primary" scope="col">Name</th>

            <th class="bg-primary" scope="col">Protagonist</th>
        </tr>
        <tr>
            <td>Kiesha Granados</td>
            <td>Fruits Basket</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSUEDSJDxeb-BbZlNFbr2FyE-WN2H8J5qs5MST2F00xsg&s=10" height="150px" width="150px"></td>
        </tr>
        <tr>
            <td>Katalina Pingol</td>
            <td>Horimiya</td>
            <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSx3PaQqpZIzYfG06LS-PhgKAyBupvKxv83E2_6_DYSDGTvAK2OTqGEtFm-&s=10" height="150px" width="150px"></td>

            <td>Renee Zamora</td>

        </tr>

            <td>Ashton Briddon</td>
